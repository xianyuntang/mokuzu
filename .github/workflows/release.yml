name: Release

# Pushing a tag like v0.2.0 builds the release targets and publishes a GitHub release.
# Running it by hand (workflow_dispatch) builds the same archives without releasing,
# to check the build before tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the platform in use; add a row here to ship another.
          # 22.04 builds against an older glibc (2.35), so the binary also runs on older distros.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            arch: arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/mokuzu/Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=mokuzu-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/mokuzu LICENSE-MIT LICENSE-APACHE config.example.toml "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: mokuzu-${{ matrix.target }}
          path: mokuzu-${{ matrix.target }}.tar.gz*
      # Each runner also builds the image for its own architecture from the binary it just
      # built; the docker job below joins them under one tag.
      - name: Stage binary for Docker
        if: startsWith(github.ref, 'refs/tags/')
        run: mkdir -p dist/${{ matrix.arch }} && cp target/${{ matrix.target }}/release/mokuzu dist/${{ matrix.arch }}/
      - uses: docker/setup-buildx-action@v3
        if: startsWith(github.ref, 'refs/tags/')
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: BINARY=prebuilt
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.arch }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --generate-notes dist/*.tar.gz dist/SHA256SUMS install.sh

  # One multi-arch tag over the per-architecture images the build jobs pushed.
  docker:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: |
          image=ghcr.io/${{ github.repository }}
          docker buildx imagetools create -t "$image:$GITHUB_REF_NAME" -t "$image:latest" \
            "$image:$GITHUB_REF_NAME-amd64" "$image:$GITHUB_REF_NAME-arm64"
