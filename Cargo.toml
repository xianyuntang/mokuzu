[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

# songbird 0.6.1 hands DAVE-encrypted voice to the Opus decoder with the DAVE trailer still on,
# so every frame fails to decode (serenity-rs/songbird#315). Drop once a release fixes it.
[patch.crates-io]
songbird = { path = "vendor/songbird" }

[profile.dev]
opt-level = 0
debug = "line-tables-only" # keep file:line for backtraces only
split-debuginfo = "packed" # one .dSYM/.dwp instead of per-object debug info

[profile.dev.package."*"]
opt-level = 2
debug = false # no debug info for third-party crates

[profile.release]
strip = true # no symbols in shipped binaries; they are most of the download
lto = "thin"
codegen-units = 1
