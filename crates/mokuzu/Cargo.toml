[package]
name = "mokuzu"
version = "0.5.31"
edition = "2024"
description = "A personal agent you chat with in the terminal or over Discord"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xianyuntang/mokuzu"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chrono = "0.4.45"
chrono-tz = "0.10.4"
croner = "4.0.0"
futures = "0.3"
hayro = "0.8.0"
html2text = "0.17.1"
iana-time-zone = "0.1.65"
include_dir = "0.7.4"
pdf-extract = "0.12.1"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rig-core = "0.42.0"
rmcp = { version = "3.4.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = { version = "2.6.0", features = ["from-directory"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "rustls_backend", "voice"] }
songbird = { version = "0.6.1", default-features = false, features = ["serenity", "driver", "gateway", "receive", "rustls", "tungstenite"] }
# Only to turn on PCM decoding, which songbird needs to play raw audio.
symphonia = { version = "0.5.5", default-features = false, features = ["pcm"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
